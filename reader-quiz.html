<style>

:root{--bg:#efe9df;--paper:#f8f4ec;--ink:#1f1b18;--muted:#6b625b;--red:#9e2f2a;--line:#c9b9aa}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;background:#171310;color:var(--ink)}body{overflow:hidden}
button{font:inherit}
.stage{width:100vw;height:100vh;min-height:720px;position:relative;overflow:hidden;background:linear-gradient(90deg,rgba(247,242,234,.96) 0 64%,rgba(239,230,218,.83) 100%),radial-gradient(circle at 82% 20%,rgba(255,240,211,.55),transparent 26%)}
.app{position:relative;z-index:2;height:100%;padding:3.2vh 3.2vw;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand small{display:block;color:var(--red);font-size:clamp(15px,1vw,24px);letter-spacing:.12em;margin-bottom:.35em}.brand h1{margin:0;font-size:clamp(30px,2.4vw,52px);font-weight:700}.top-actions{display:flex;gap:12px}.ghost{border:1px solid var(--line);background:rgba(255,255,255,.56);border-radius:14px;padding:13px 20px;cursor:pointer;min-height:52px}
.screen{flex:1;display:none;align-items:center;justify-content:center}.screen.active{display:flex}
.intro-card,.question-card,.result-card{width:min(1400px,92vw);max-height:78vh;overflow:auto;background:rgba(248,244,236,.94);border:1px solid rgba(115,91,72,.23);border-radius:28px;padding:clamp(30px,3.4vw,68px);box-shadow:0 24px 70px rgba(48,36,28,.15)}
.intro-card{text-align:center}.kicker{color:var(--red);font-size:clamp(18px,1.2vw,26px);letter-spacing:.1em;font-weight:700}.big-title{font-size:clamp(50px,5vw,105px);line-height:1.05;margin:.22em 0 .18em}.lead{font-size:clamp(24px,1.8vw,38px);line-height:1.6;color:#39322d;max-width:980px;margin:0 auto 1.2em}.start-btn,.primary{border:0;background:var(--red);color:#fff;border-radius:18px;padding:20px 42px;font-size:clamp(24px,1.6vw,34px);font-weight:700;cursor:pointer;min-width:240px;min-height:76px;box-shadow:0 8px 22px rgba(158,47,42,.2)}
.progress-wrap{margin-bottom:28px}.progress-label{display:flex;justify-content:space-between;color:var(--muted);font-size:clamp(16px,1vw,22px);margin-bottom:8px}.progress{height:10px;background:#ded4c8;border-radius:999px;overflow:hidden}.progress>div{height:100%;width:0;background:var(--red);transition:width .25s}.question{font-size:clamp(34px,3vw,62px);line-height:1.28;margin:.25em 0 .7em}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.option{border:1px solid var(--line);background:rgba(255,255,255,.72);border-radius:18px;padding:20px 24px;min-height:108px;text-align:left;cursor:pointer;font-size:clamp(20px,1.35vw,29px);transition:.16s ease;display:flex;gap:16px;align-items:flex-start}.option:hover,.option:focus-visible{transform:translateY(-2px);border-color:var(--red);outline:3px solid rgba(158,47,42,.12)}.letter{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#eee4d8;color:var(--red);font-weight:700}
.result-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:34px;align-items:start}.type-badge{display:inline-block;border-radius:999px;padding:9px 16px;color:#fff;background:var(--tone);font-size:20px;margin-bottom:16px}.result-name{font-size:clamp(48px,4vw,88px);line-height:1.1;margin:.1em 0 .3em}.result-copy{font-size:clamp(21px,1.35vw,30px);line-height:1.75;color:#403933}.quote{font-size:clamp(24px,1.7vw,36px);line-height:1.6;border-left:5px solid var(--tone);padding-left:22px;margin:25px 0}.recommend{border:1px solid var(--line);border-radius:22px;background:#fff;padding:26px}.recommend h3{margin:0 0 14px;font-size:28px}.book-list{display:grid;gap:12px}.book{padding:15px 17px;border-radius:14px;background:#f2ece3;font-size:23px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.secondary{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 22px;min-height:56px;cursor:pointer}.home-hint{text-align:center;color:#695f57;font-size:18px;margin-top:10px}
@media (max-width:900px){.options,.result-grid{grid-template-columns:1fr}.app{padding:20px}.intro-card,.question-card,.result-card{max-height:82vh;padding:28px}}


/* ===== 三語切換 ===== */
.top-actions{
  display:grid;
  grid-template-columns:216px 132px 132px;
  align-items:center;
  justify-content:end;
  gap:12px;
  width:504px;
  flex:0 0 504px;
}
.language-switcher{
  width:216px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
#restartTop,
#homeTop{
  width:132px;
  white-space:nowrap;
}
.lang-btn{
  width:100%;
  height:42px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.56);
  border-radius:12px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  white-space:nowrap;
  line-height:1;
  padding:0 8px;
  color:var(--ink);
}
.lang-btn.active{
  border-color:var(--red);
  color:var(--red);
  background:#fff;
  font-weight:700;
}
html[lang="ja"] .brand h1{letter-spacing:.02em}
html[lang="en"] .brand h1{letter-spacing:0}
html[lang="en"] .big-title{font-size:clamp(44px,4.2vw,88px)}
html[lang="ja"] .big-title{font-size:clamp(46px,4.4vw,92px)}
@media (max-width:900px){
  body{overflow:auto}
  .stage{height:auto;min-height:100dvh;overflow:visible}
  .app{height:auto;min-height:100dvh}
  .topbar{align-items:flex-start;flex-direction:column}
  .top-actions{
    width:100%;
    flex:none;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .language-switcher{
    grid-column:1 / -1;
    width:100%;
  }
  #restartTop,
  #homeTop{
    width:100%;
  }
  .ghost{width:100%;padding:11px 14px;min-height:48px}
  .screen{min-height:calc(100dvh - 190px)}
  .intro-card,.question-card,.result-card{max-height:none}
  html[lang="en"] .big-title{font-size:clamp(40px,12vw,62px)}
  html[lang="ja"] .big-title{font-size:clamp(42px,12vw,64px)}
}

更深的黑暗，而你願意直視那份複雜。"},{"name":"正義辯證者","case":"CASE 04｜正義","tone":"#7b6648","zone":"當社會製造了罪犯","books":["《徬徨之刃》","《空洞的十字架》","《白金數據》"],"quote":"你在意的不只是誰犯了罪，而是這個社會如何共同完成了它。","copy":"你在閱讀時不會只停留在個人命運，你會去思考法律、制度、科技與社會結構如何影響一場悲劇。你常常讀完之後還停不下來，因為你知道：有時該被質問的，不只是一個兇手。"},{"name":"青春回望者","case":"CASE 05｜青春","tone":"#66765f","zone":"青春從來不只是青春","books":["《放學後》","《同級生》","《畢業》"],"quote":"你知道，青春裡那些看似微小的事，往往最能改變一個人。","copy":"你特別容易被校園、友情、競爭、嫉妒與成長中的脆弱打動。因為你知道，青春從來不是輕飄飄的，而是會留下很深痕跡的人生時期。你讀這類故事時，常常像是在重新看見自己曾經走過的某段年少時光。"},{"name":"溫柔解謎者","case":"CASE 06｜希望","tone":"#5f7489","zone":"沒有命案，也可以是東野圭吾","books":["《解憂雜貨店》","《祈念之樹》","《時生》"],"quote":"你願意走進故事，不只是為了答案，也是為了帶走一點光。","copy":"你相信故事除了揭露黑暗，也可以帶來理解與安慰。你不一定最在意誰是兇手，而更在意人與人之間是否還有重新連結的可能。對你來說，有些謎題真正的答案，不是破解，而是理解。"}]},"ja":{"pageTitle":"あなたはどのタイプの東野圭吾読者？","brandExhibition":"『真実のその先――東野圭吾が描く、人間の心とミステリー』","brandTitle":"読者診断","restart":"最初からやり直す","home":"ホームへ戻る","kicker":"6 QUESTIONS · 6 READING TYPES","introTitle":"あなたはどのタイプの東野圭吾読者？","introLead":"真実が明かされたあと、あなたがいちばん気になるのは何でしょう？ 6つの問いに答えて、あなたに近い読書タイプと、おすすめの展示エリア・作品を見つけてみましょう。","start":"診断を始める","counter":"第 {current} / 6 問","instruction":"最も自分に近い答えを選んでください","goCase":"おすすめの展示へ","retake":"もう一度診断する","recommended":"おすすめの作品","recommendedZone":"あなたにぴったりの展示エリア","idleHint":"タッチスクリーンモード：60秒間操作がない場合、自動的にトップ画面へ戻ります","questions":[{"q":"ミステリーを読むとき、最初に惹かれるものは何ですか？","a":["緻密な犯行トリックと論理的な推理のプロセス","事件のあと、残された人々がどう生きていくか","登場人物どうしの断ち切れない感情","物語の背景にある社会や制度の問題","青春期特有の、小さくても激しい心の揺らぎ","物語の結末に残る温もりと希望"]},{"q":"事件の真相を知ったあと、あなたがさらに問い続けたいことは？","a":["このトリックは、いったいどうやって成立したのか？","真実が明らかになったあと、家族はどうなるのか？","なぜその人は、誰かのためにそこまでできたのか？","この事件は、制度の問題を映し出しているのではないか？","もし若い頃の自分だったら、どう選んだだろう？","傷ついたあとでも、もう一度やり直すことはできるのか？"]},{"q":"どんな物語の雰囲気に惹かれますか？","a":["冷静で理知的、一歩ずつ答えに近づいていく","静かで落ち着きがあり、余韻が深く残る","重く濃密で、感情の葛藤に満ちている","鋭く問いかけ、考えずにはいられない","瑞々しく繊細で、成長の痛みを感じる","優しく心を癒やし、最後に光が残る"]},{"q":"真実を明かすことで無実の人が傷つくとしたら、あなたはどう考えますか？","a":["それでも明らかにする。真実を曖昧にしてはいけない","まず、残される人がその真実に耐えられるかを考える","その感情の深さによる","法律や制度に委ねるべきだ","若い頃は誰でも過ちを犯しやすいことを考える","できるだけ傷つく人を減らす方法を探したい"]},{"q":"どんな登場人物に最も心を動かされますか？","a":["鋭い知性を持つ、冷静な謎解き役","平静に見えて、大きな喪失を抱えている人","愛ゆえに苦しみ、矛盾し、揺れ動く人","不公平な制度のなかで答えを求め続ける人","成長のなかで傷つき、迷う若者たち","苦しい状況でも善意を信じようとする人"]},{"q":"今すぐ一冊選ぶとしたら、その本から何を受け取りたいですか？","a":["「こんな推理の仕方があるんだ！」という驚き","「事件が終わったあとの人生のほうが難しい」という気づき","「愛と罪は、こんなにも切り離せないのか」という衝撃","「本当に裁かれるべきなのは誰か？」という問い","「青春の痛みは、こんなにも長く残るんだ」という共感","「世界が不完全でも、優しく生きていける」という慰め"]}],"types":[{"name":"理性の追跡者","case":"CASE 01｜理性","tone":"#6f6051","zone":"理性はすべてを解き明かせるのか？","books":["『容疑者Xの献身』","『聖女の救済』","『真夏の方程式』"],"quote":"あなたは答えを知りたい。同時に、答えだけでは語り尽くせない人間の心にも目を向けます。","copy":"あなたが最も気になるのは、「いったい何が、どのように起きたのか」。論理が一歩ずつ積み重なり、手がかりがつながっていく過程を楽しみ、真実は明確に証明されるべきだと考えます。でも本当に心を動かされるのは、完璧な解答そのものではなく、理性の先に人間の姿が浮かび上がる瞬間です。"},{"name":"余波の観測者","case":"CASE 02｜余波","tone":"#88664a","zone":"死のあとに、残されるのは誰か？","books":["『新参者』","『赤い指』","『麒麟の翼』"],"quote":"あなたが見つめるのは事件の結末だけでなく、その後を生きる人々です。","copy":"犯人を突き止めること以上に、あなたが気になるのは事件のあとに残された人々です。表面上は平静に見える人が、悲しみや秘密、喪失を抱えながらどう生きていくのかを見つめます。あなたにとって真実は終点ではなく、感情の余波が始まる場所です。"},{"name":"感情の探求者","case":"CASE 03｜愛","tone":"#995b68","zone":"愛は、犯罪の理由になり得るのか？","books":["『白夜行』","『秘密』","『幻夜』"],"quote":"あなたが理解したいのは罪だけではなく、その奥に絡みつく感情です。","copy":"あなたは、愛、犠牲、執着、守ることといった感情のテーマに強く惹かれます。「人は誰かのために、いったいどこまでできるのか」と問い続けます。愛は必ずしも人を救うとは限らず、ときに深い闇へ導くこともある。その複雑さから目をそらさないタイプです。"},{"name":"正義の探求者","case":"CASE 04｜正義","tone":"#7b6648","zone":"社会が犯罪者を生み出すとき","books":["『さまよう刃』","『虚ろな十字架』","『プラチナデータ』"],"quote":"あなたが問うのは、誰が罪を犯したかだけではなく、社会がその事件にどう関わったかです。","copy":"あなたは個人の運命だけで物語を読み終えません。法律、制度、テクノロジー、社会構造が悲劇にどう影響したのかを考えます。読み終わっても問いが残るのは、ときに問われるべきものが一人の犯人だけではないと知っているからです。"},{"name":"青春の追想者","case":"CASE 05｜青春","tone":"#66765f","zone":"青春は、ただの青春ではない","books":["『放課後』","『同級生』","『卒業』"],"quote":"あなたは、青春の小さな出来事ほど、人を大きく変えることがあると知っています。","copy":"学校、友情、競争、嫉妬、そして成長のなかの脆さに心を動かされやすいタイプです。青春は決して軽いものではなく、人生に深い痕跡を残す時期だと知っています。こうした物語を読むと、自分がかつて歩いた若い時間を見つめ直しているように感じることがあります。"},{"name":"やさしい謎解き人","case":"CASE 06｜希望","tone":"#5f7489","zone":"殺人事件がなくても、東野圭吾","books":["『ナミヤ雑貨店の奇蹟』","『クスノキの番人』","『時生』"],"quote":"あなたが物語に入るのは、答えのためだけではありません。そこから一筋の光を持ち帰るためでもあります。","copy":"物語は闇を暴くだけでなく、理解や慰めをもたらすこともできると信じています。犯人が誰かよりも、人と人がもう一度つながれるかどうかに心を向けます。あなたにとって、ある種の謎の本当の答えは「解くこと」ではなく「理解すること」です。"}]},"en":{"pageTitle":"What Kind of Keigo Higashino Reader Are You?","brandExhibition":"Beyond the Truth — Keigo Higashino: Human Nature Behind the Mystery","brandTitle":"Reader Quiz","restart":"Restart","home":"Back to Home","kicker":"6 QUESTIONS · 6 READING TYPES","introTitle":"What Kind of Keigo Higashino Reader Are You?","introLead":"After the truth is revealed, what matters most to you? Answer six questions to discover your reading type—and the exhibition zone and books that suit you best.","start":"Start Quiz","counter":"Question {current} of 6","instruction":"Choose the answer that fits you best","goCase":"Go to Your Exhibition Zone","retake":"Retake Quiz","recommended":"Recommended Reading","recommendedZone":"Your Recommended Exhibition Zone","idleHint":"Touchscreen mode: after 60 seconds of inactivity, the quiz will return to the start screen.","questions":[{"q":"When you read a mystery novel, what draws you in first?","a":["An intricate method and the rigorous process of deduction","How the people left behind continue with their lives","The emotional bonds characters cannot let go of","The social flaws and institutional issues behind the story","The subtle yet intense emotions of youth","The warmth and hope that remain at the end"]},{"q":"Once you know the truth of a case, what would you most want to ask next?","a":["How exactly was this trick carried out?","What happens to the family after the truth comes out?","Why was someone willing to go that far for another person?","Does this case reveal deeper flaws within the system?","If this happened when I was young, what would I have chosen?","Is it possible to begin again after harm has been done?"]},{"q":"Which kind of atmosphere do you prefer in a story?","a":["Calm, logical, and steadily closing in on the answer","Quiet, understated, and rich in lingering resonance","Intense, emotionally charged, and full of conflict","Sharp, provocative, and unsettling in a thought-provoking way","Tender, sensitive, and marked by the growing pains of youth","Gentle, restorative, and illuminated by hope"]},{"q":"If revealing the truth would hurt an innocent person, which response is closest to yours?","a":["Reveal it anyway—the truth must not be compromised","First consider whether those left behind can bear the weight","It depends on how deep the feelings involved are","Leave it to the judgment of law and institutional principles","I would remember how easily people make mistakes when they are young","Seek a compassionate way that minimizes harm to everyone"]},{"q":"Which kind of character moves you most?","a":["A brilliant solver with cool, razor-sharp deduction","Someone who appears calm while carrying a profound loss","Someone torn by love, pain, and contradiction","Someone fighting for answers within an unjust system","Young people who are hurt and lost while growing up","Someone who still believes in kindness despite hardship"]},{"q":"If you had to choose one book to read right now, what experience do you seek most?","a":["The thrill of thinking, “I never knew a mystery could work like this!”","The realization that life after a case can be even harder","The shock of seeing how difficult it is to separate love from crime","The question, “Who should really be judged?”","The recognition that the pain of youth can last for years","The comfort of knowing that even in an imperfect world, we can still live with kindness"]}],"types":[{"name":"The Rational Tracker","case":"CASE 01｜Reason","tone":"#6f6051","zone":"Can Reason Explain Everything?","books":["The Devotion of Suspect X","Salvation of a Saint","A Midsummer’s Equation"],"quote":"You seek the answer—yet you also notice what logic alone cannot explain.","copy":"What matters most to you is how things actually happened. You enjoy watching logic advance step by step and clues lock into place, and you believe the truth should be clearly established. Yet what truly moves you is not the perfect solution itself, but the moment when reason reaches its limit and humanity comes into view."},{"name":"The Aftermath Observer","case":"CASE 02｜Aftermath","tone":"#88664a","zone":"Who Remains After Death?","books":["Newcomer","The Red Finger","The Wings of the Kirin"],"quote":"You see beyond the case—you see the lives that must carry on afterward.","copy":"More than identifying the culprit, you care about the people who remain after the case is over. You notice how seemingly composed people continue living with grief, secrets, and loss. For you, the truth is not the endpoint—it is where the emotional aftermath begins."},{"name":"The Emotional Explorer","case":"CASE 03｜Love","tone":"#995b68","zone":"Can Love Justify Crime?","books":["Journey Under the Midnight Sun","Secret","Phantom Night"],"quote":"You seek to understand not only the crime, but the emotions entangled within it.","copy":"You are drawn to themes of love, sacrifice, possession, and protection. You keep asking how far one person can go for another. You know that love does not always save people; sometimes it leads them deeper into darkness, and you are willing to face that complexity."},{"name":"The Justice Questioner","case":"CASE 04｜Justice","tone":"#7b6648","zone":"When Society Creates Criminals","books":["The Hovering Blade","Hollow Cross","Platinum Data"],"quote":"You question not only who committed the crime, but how society helped make it possible.","copy":"You do not stop at individual fate. You think about how law, institutions, technology, and social structures shape a tragedy. The questions often stay with you after the book ends, because you know that sometimes the culprit is not the only thing that deserves scrutiny."},{"name":"The Youth Reflector","case":"CASE 05｜Youth","tone":"#66765f","zone":"Youth Is Never Just Youth","books":["After School","Classmates","Graduation"],"quote":"You know that even the smallest moments of youth can shape a life profoundly.","copy":"You are especially moved by school life, friendship, competition, jealousy, and the vulnerability of growing up. You know that youth is never weightless; it can leave deep marks on a life. Reading these stories can feel like looking back at a younger version of yourself."},{"name":"The Gentle Solver","case":"CASE 06｜Hope","tone":"#5f7489","zone":"Higashino Beyond Murder Mysteries","books":["The Miracles of the Namiya General Store","The Camphorwood Custodian","Tokio"],"quote":"You enter a story not only for the answer, but also to carry a little light away with you.","copy":"You believe stories can do more than expose darkness—they can also offer understanding and comfort. You may care less about who the culprit is than whether people can reconnect. For you, the true answer to some mysteries is not solving them, but understanding them."}]}};

function normalizeLang(value){
  if(!value) return null;
  const v=String(value).toLowerCase();
  if(v==="zh" || v==="zh-hant" || v==="zh_tw" || v==="zh-tw") return "zh-Hant";
  if(v==="ja" || v==="jp" || v==="ja-jp") return "ja";
  if(v==="en" || v==="en-us" || v==="en-gb") return "en";
  return null;
}
function resolveInitialLanguage(){
  const params=new URLSearchParams(window.location.search);
  const fromUrl=normalizeLang(params.get("lang"));
  if(fromUrl) return fromUrl;
  const fromStorage=normalizeLang(localStorage.getItem("truthAfterLang"));
  if(fromStorage) return fromStorage;
  return "zh-Hant";
}
let currentLang=resolveInitialLanguage();

function withCurrentLang(url){
  const u=new URL(url,window.location.href);
  u.searchParams.set("lang",LANGUAGE_CONFIG[currentLang].query);
  return u.pathname.split("/").pop()+u.search+u.hash;
}
function formatText(text,vars={}){
  return String(text).replace(/\{(\w+)\}/g,(_,k)=>vars[k] ?? "");
}
function updateLanguageButtons(){
  document.querySelectorAll(".lang-btn").forEach(btn=>{
    const active=btn.dataset.lang===currentLang;
    btn.classList.toggle("active",active);
    btn.setAttribute("aria-pressed",active?"true":"false");
  });
}

  document.getElementById("introLead").textContent=t.introLead;
  document.getElementById("startBtn").textContent=t.start;
  document.getElementById("quizInstruction").textContent=t.instruction;
  document.getElementById("goCaseBtn").textContent=t.goCase;
  document.getElementById("restartBtn").textContent=t.retake;
  document.getElementById("recommendTitle").textContent=t.recommended;
  document.getElementById("zoneTitle").textContent=t.recommendedZone;
  document.getElementById("idleHint").textContent=t.idleHint;

}
function setLanguage(lang,{syncUrl=true}={}){
  const normalized=normalizeLang(lang) || "zh-Hant";
  currentLang=normalized;
  localStorage.setItem("truthAfterLang",currentLang);
  if(syncUrl){
    const u=new URL(window.location.href);
    u.searchParams.set("lang",LANGUAGE_CONFIG[currentLang].query);
    history.replaceState(null,"",u.pathname+u.search+u.hash);
  }
  applyStaticTranslations();
  if(quiz.classList.contains("active")) renderQ();
  if(result.classList.contains("active")) renderResult(currentResultIndex,true);
}
function show(s){
  [intro,quiz,result].forEach(x=>x.classList.remove("active"));
  s.classList.add("active");
}
function renderQ(){
  const t=I18N[currentLang];
  const item=t.questions[qi];
  qText.textContent=item.q;
  qCounter.textContent=formatText(t.counter,{current:qi+1});
  bar.style.width=`${(qi/t.questions.length)*100}%`;
  opts.innerHTML="";
  item.a.forEach((text,i)=>{
    const b=document.createElement("button");
    b.className="option";
    b.type="button";
    const letter=document.createElement("span");
    letter.className="letter";
    letter.textContent=String.fromCharCode(65+i);
    const label=document.createElement("span");
    label.textContent=text;
    b.append(letter,label);
    b.addEventListener("click",()=>{
      scores[i]++;
      lastChoice=i;
      qi++;
      if(qi<t.questions.length) renderQ();
      else renderResult();
    });
    opts.appendChild(b);
  });
}
function renderResult(forcedIndex=null,preserveScreen=false){
  let idx=forcedIndex;
  if(idx===null){
    const max=Math.max(...scores);
    const tied=scores.map((s,i)=>s===max?i:-1).filter(i=>i>=0);
    idx=tied.includes(lastChoice)?lastChoice:tied[0];
  }
  currentResultIndex=idx;
  const t=I18N[currentLang].types[idx];
  document.getElementById("resultCase").textContent=t.case;
  document.getElementById("resultCase").style.background=t.tone;
  document.getElementById("resultName").textContent=t.name;
  document.getElementById("resultQuote").textContent=t.quote;
  document.getElementById("resultQuote").style.borderColor=t.tone;
  document.getElementById("resultCopy").textContent=t.copy;
  document.getElementById("zone").textContent=t.zone;
  document.getElementById("books").innerHTML="";
  t.books.forEach(book=>{
    const div=document.createElement("div");
    div.className="book";
    div.textContent=book;
    document.getElementById("books").appendChild(div);
  });
  document.querySelector(".result-card").style.setProperty("--tone",t.tone);
  bar.style.width="100%";
  if(!preserveScreen) show(result);
}
function reset(){
  qi=0;
  scores=[0,0,0,0,0,0];
  lastChoice=0;
  currentResultIndex=0;
  show(intro);
}

document.querySelectorAll(".lang-btn").forEach(btn=>{
  btn.addEventListener("click",()=>setLanguage(btn.dataset.lang));
});
document.getElementById("startBtn").addEventListener("click",()=>{
  qi=0;scores=[0,0,0,0,0,0];lastChoice=0;
  show(quiz);renderQ();
});
document.getElementById("restartBtn").addEventListener("click",reset);
document.getElementById("restartTop").addEventListener("click",reset);
document.getElementById("homeTop").addEventListener("click",()=>{
  window.location.href=withCurrentLang("./index.html");
});
document.getElementById("goCaseBtn").addEventListener("click",()=>{
  const caseKeys=["reason","after","love","justice","youth","hope"];
  const key=caseKeys[currentResultIndex] || "reason";
  const u=new URL("./index.html",window.location.href);
  u.searchParams.set("case",key);
  u.searchParams.set("lang",LANGUAGE_CONFIG[currentLang].query);
  window.location.href=u.pathname.split("/").pop()+u.search;
});

applyStaticTranslations();
/* 若主頁已經把語言寫入 truthAfterLang，這裡會自動沿用；
   若網址帶 ?lang=，網址設定優先，並同步回 localStorage。 */
localStorage.setItem("truthAfterLang",currentLang);

if(typeof createIdleTimer==="function"){
  createIdleTimer(reset);
}
</script>
</body>
</html>
