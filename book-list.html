<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>完整書單｜真相之後</title>
<style>

:root{
  --ink:#2b241f;--muted:#756b62;--red:#9e2f2a;
  --line:rgba(92,73,59,.18);--shadow:0 16px 45px rgba(72,52,38,.12)
}
*{box-sizing:border-box}
html,body{
  margin:0;min-height:100%;
  background:linear-gradient(135deg,#efe5d8,#f8f2e9 45%,#eee1d2);
  color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif
}
body{overflow-x:hidden}
button,input{font:inherit}
.page{min-height:100vh;padding:34px 48px 48px}

.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;justify-content:space-between;gap:24px;
  padding:18px 22px;margin:-8px -8px 26px;
  background:rgba(247,241,232,.92);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.55);
  border-radius:24px;
  box-shadow:0 10px 30px rgba(70,50,35,.08)
}
.back-btn{
  border:0;background:var(--red);color:#fff;border-radius:999px;
  padding:15px 24px;font-weight:800;cursor:pointer
}
.brand{text-align:center;flex:1}
.brand .eyebrow{font-size:14px;letter-spacing:.18em;color:var(--red);font-weight:800}
.brand h1{
  font-family:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",serif;
  margin:5px 0 0;font-size:clamp(34px,3.2vw,60px);line-height:1
}
.count{min-width:150px;text-align:right;color:var(--muted);font-weight:700}

.controls{
  display:grid;grid-template-columns:minmax(260px,1.1fr) 2fr;
  gap:18px;align-items:center;margin-bottom:24px
}
.search{
  width:100%;border:1px solid var(--line);border-radius:18px;
  background:rgba(255,250,243,.9);padding:16px 18px;outline:none;font-size:18px
}
.filters{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.filter{
  border:1px solid var(--line);background:rgba(255,250,243,.86);
  border-radius:16px;padding:14px 8px;cursor:pointer;font-weight:800
}
.filter.active{background:var(--red);color:#fff;border-color:var(--red);transform:translateY(-2px)}

.section{animation:fadeUp .38s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.section-head{
  display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
  margin:32px 0 20px;padding:0 4px
}
.case-label{font-size:14px;font-weight:900;letter-spacing:.12em;color:var(--red);margin-bottom:8px}
.section-head h2{
  font-family:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",serif;
  font-size:clamp(28px,2.3vw,44px);margin:0 0 6px
}
.section-head p{margin:0;color:var(--muted);font-size:18px}
.section-total{color:var(--muted);font-weight:800;white-space:nowrap}

.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}
.book{
  background:rgba(255,250,243,.92);
  border:1px solid var(--line);border-radius:22px;padding:14px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;
  min-height:410px;transition:.2s ease
}
.book:hover{transform:translateY(-4px)}

/* 正方形書封展示框，完整顯示，不裁切 */
.cover-wrap{
  width:100%;
  aspect-ratio:1 / 1;
  border-radius:16px;
  background:#fff;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px;
  border:1px solid rgba(92,73,59,.10);
}
.cover{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center;
  border-radius:10px;
}

.book h3{
  font-family:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",serif;
  font-size:21px;line-height:1.35;margin:14px 2px 8px
}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.tag{
  display:inline-flex;border-radius:999px;padding:5px 9px;
  font-size:13px;font-weight:800;background:#eee4d7;color:#6a5d53
}
.jp-note{
  display:inline-flex;border-radius:999px;padding:5px 9px;
  font-size:13px;font-weight:800;background:#f1e5e1;color:#8d5149
}
.pending-note{
  display:inline-flex;border-radius:999px;padding:5px 9px;
  font-size:13px;font-weight:800;background:#ece9e4;color:#77716a
}

.book-actions{
  margin-top:auto;
  display:grid;
  grid-template-columns:1fr;
  gap:9px;
  padding-top:14px
}
.book-actions.two{grid-template-columns:1fr 1fr}
.book-actions button{
  border:1px solid var(--line);border-radius:14px;padding:12px 8px;
  background:#fffaf4;cursor:pointer;font-weight:800
}
.book-actions .primary{
  background:var(--red);color:#fff;border-color:var(--red)
}
.book-actions .jp{
  background:#f3ebe5;color:#76483f;border-color:#d9c4ba
}
.book-actions .pending{
  background:#ece8e2;color:#817971;border-color:#d8d1c8;cursor:default
}

.empty{display:none;text-align:center;padding:80px 20px;color:var(--muted);font-size:20px}
.empty.show{display:block}

.modal{
  position:fixed;inset:0;z-index:100;background:rgba(31,23,18,.68);
  display:none;align-items:center;justify-content:center;padding:24px
}
.modal.show{display:flex}
.modal-card{
  width:min(780px,92vw);background:#fffaf3;border-radius:28px;
  padding:26px;box-shadow:0 28px 90px rgba(0,0,0,.28)
}
.modal-top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}
.modal-top h2{
  font-family:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",serif;
  margin:0;font-size:34px
}
.close{
  border:0;border-radius:999px;background:#eee3d8;
  padding:10px 16px;cursor:pointer;font-weight:800
}
.qr-box{
  display:grid;grid-template-columns:280px 1fr;gap:26px;
  align-items:center;margin-top:24px
}
.qr-box img{
  width:100%;aspect-ratio:1/1;object-fit:contain;
  border-radius:18px;background:#fff;border:12px solid #fff;
  box-shadow:0 10px 30px rgba(0,0,0,.09)
}
.qr-copy h3{margin:0 0 8px;font-size:24px}
.qr-copy p{color:var(--muted);line-height:1.7;margin:6px 0}
.url{
  word-break:break-all;background:#f2e9df;border-radius:14px;
  padding:12px;font-size:13px;color:#6d6259;margin-top:12px
}

@media(max-width:1500px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:1100px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .controls{grid-template-columns:1fr}
  .filters{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:760px){
  .page{padding:18px}.count{display:none}
  .grid{grid-template-columns:repeat(2,1fr)}
  .filters{grid-template-columns:repeat(2,1fr)}
  .qr-box{grid-template-columns:1fr}
  .book-actions.two{grid-template-columns:1fr}
}


/* ===== 三語切換 ===== */
.topbar{position:sticky}
.language-switcher{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  width:216px;
  flex:0 0 216px;
}
.lang-btn{
  border:1px solid var(--line);
  background:rgba(255,250,243,.86);
  border-radius:14px;
  height:42px;
  padding:0 8px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  white-space:nowrap;
  color:var(--ink);
  font-weight:800;
}
.lang-btn.active{
  background:var(--red);
  border-color:var(--red);
  color:#fff;
}
.back-btn{white-space:nowrap}
.topbar-left,.topbar-right{
  display:flex;align-items:center;gap:12px;
}
.topbar-left{min-width:160px}
.topbar-right{min-width:378px;justify-content:flex-end}
html[lang="en"] .brand h1{font-family:Georgia,"Times New Roman",serif}
html[lang="ja"] .brand h1{font-family:"Noto Serif JP","Yu Mincho","Hiragino Mincho ProN",serif}
html[lang="en"] .book h3{font-family:Georgia,"Times New Roman",serif}
html[lang="ja"] .book h3{font-family:"Noto Serif JP","Yu Mincho","Hiragino Mincho ProN",serif}
@media(max-width:1100px){
  .topbar{flex-wrap:wrap}
  .brand{order:1;flex:1 1 100%}
  .topbar-left{order:2}
  .topbar-right{order:3;min-width:0;flex:1;justify-content:flex-end}
}
@media(max-width:760px){
  .topbar{align-items:stretch}
  .topbar-left,.topbar-right{width:100%;min-width:0}
  .topbar-left{order:2}
  .topbar-right{order:3;display:grid;grid-template-columns:1fr;gap:10px}
  .language-switcher{width:100%}
  .back-btn{width:100%}
}

</style>
<script src="./js/common.js"></script>
</head>
<body>
<div class="page">
<header class="topbar">
  <div class="topbar-left">
    <button class="back-btn" id="backBtn">← 返回首頁</button>
  </div>

  <div class="brand">
    <div class="eyebrow" id="brandEyebrow"></div>
    <h1 id="brandTitle"></h1>
  </div>

  <div class="topbar-right">
    <div class="language-switcher" aria-label="Language">
      <button class="lang-btn" type="button" data-lang="zh-Hant">繁中</button>
      <button class="lang-btn" type="button" data-lang="ja">日本語</button>
      <button class="lang-btn" type="button" data-lang="en">EN</button>
    </div>
    <div class="count" id="countWrap"></div>
  </div>
</header>

<div class="controls">
  <input id="search" class="search" type="search" autocomplete="off">
  <div class="filters" id="filters"></div>
</div>

<main id="content"></main>
<div id="empty" class="empty"></div>
</div>

<div id="modal" class="modal">
  <div class="modal-card">
    <div class="modal-top">
      <div>
        <div class="case-label" id="modalEdition"></div>
        <h2 id="modalTitle"></h2>
      </div>
      <button class="close" id="modalCloseBtn"></button>
    </div>
    <div class="qr-box">

      <div class="qr-copy">
        <h3 id="scanTitle"></h3>
        <p id="scanBody"></p>
        <div id="catalogUrl" class="url"></div>
      </div>
    </div>
  </div>
</div>

let currentFilter="all",query="",currentLang=resolveInitialLanguage();
const content=document.getElementById("content");
const empty=document.getElementById("empty");

function normalizeLang(value){
  if(!value)return null;
  const v=String(value).toLowerCase();
  if(["zh","zh-hant","zh_tw","zh-tw"].includes(v))return "zh-Hant";
  if(["ja","jp","ja-jp"].includes(v))return "ja";
  if(["en","en-us","en-gb"].includes(v))return "en";
  return null;
}
function resolveInitialLanguage(){
  const params=new URLSearchParams(window.location.search);
  return normalizeLang(params.get("lang"))||
         normalizeLang(localStorage.getItem("truthAfterLang"))||
         "zh-Hant";
}
function withCurrentLang(url){
  const u=new URL(url,window.location.href);
  u.searchParams.set("lang",LANGUAGE_CONFIG[currentLang].query);
  return u.pathname.split("/").pop()+u.search+u.hash;
}
function fmt(text,vars={}){
  return String(text).replace(/\{(\w+)\}/g,(_,k)=>vars[k]??"");
}
function esc(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function getTitle(b){
  if(currentLang==="ja")return b.titleJa||b.titleZh;
  if(currentLang==="en")return b.titleEn||b.titleZh;
  return b.titleZh;
}
function secText(sec){
  return SECTION_I18N[sec.key][currentLang];
}
function updateLangButtons(){
  document.querySelectorAll(".lang-btn").forEach(btn=>{
    const active=btn.dataset.lang===currentLang;
    btn.classList.toggle("active",active);
    btn.setAttribute("aria-pressed",active?"true":"false");
  });
}
function buildFilters(){
  const u=UI[currentLang];
  const items=[{key:"all",label:u.all},...sections.map(s=>({key:s.key,label:secText(s).label}))];
  const box=document.getElementById("filters");
  box.innerHTML=items.map(item=>`<button class="filter ${currentFilter===item.key?"active":""}" data-filter="${item.key}">${esc(item.label)}</button>`).join("");
  box.querySelectorAll(".filter").forEach(btn=>btn.addEventListener("click",()=>{
    currentFilter=btn.dataset.filter;
    buildFilters();
    render();
  }));
}
function applyStatic(){
  const u=UI[currentLang];
  document.documentElement.lang=LANGUAGE_CONFIG[currentLang].htmlLang;
  document.title=u.pageTitle;
  document.getElementById("backBtn").textContent=u.back;
  document.getElementById("brandEyebrow").textContent=u.eyebrow;
  document.getElementById("brandTitle").textContent=u.title;
  document.getElementById("search").placeholder=u.search;
  document.getElementById("empty").textContent=u.empty;
  document.getElementById("modalEdition").textContent=u.modalEdition;
  document.getElementById("modalCloseBtn").textContent=u.close;
  document.getElementById("scanTitle").textContent=u.scanTitle;
  document.getElementById("scanBody").textContent=u.scanBody;
  updateLangButtons();
  buildFilters();
}
function setLanguage(lang,{syncUrl=true}={}){
  currentLang=normalizeLang(lang)||"zh-Hant";
  localStorage.setItem("truthAfterLang",currentLang);
  if(syncUrl){
    const u=new URL(window.location.href);
    u.searchParams.set("lang",LANGUAGE_CONFIG[currentLang].query);
    history.replaceState(null,"",u.pathname+u.search+u.hash);
  }
  applyStatic();
  render();
}

function render(){
  const u=UI[currentLang];
  const q=query.trim().toLowerCase();
  let out="",visible=0;

  sections.forEach(sec=>{
    if(currentFilter!=="all" && sec.key!==currentFilter)return;
    const st=secText(sec);

    const books=sec.books.filter(b=>{
      if(!q)return true;
      const hay=[
        b.titleZh,b.titleJa,b.titleEn,b.labelZh,b.labelJp,
        SECTION_I18N[sec.key]["zh-Hant"].title,
        SECTION_I18N[sec.key]["ja"].title,
        SECTION_I18N[sec.key]["en"].title
      ].filter(Boolean).join(" ").toLowerCase();
      return hay.includes(q);
    });

    if(!books.length)return;
    visible+=books.length;

    out+=`
      <section class="section">
        <div class="section-head">
          <div>
            <div class="case-label">${esc(st.case)}</div>
            <h2>${esc(st.title)}</h2>
            <p>${esc(st.subtitle)}</p>
          </div>
          <div class="section-total">${esc(fmt(u.works,{n:books.length}))}</div>
        </div>
        <div class="grid">
          ${books.map(b=>{
            const title=getTitle(b);
            return `
            <article class="book">
              <div class="cover-wrap">
                <img class="cover" src="${esc(b.img)}" alt="${esc(title)}" loading="lazy"
                  onerror="this.style.display='none';this.parentElement.textContent='${esc(u.coverLoading)}';">
              </div>
              <h3>${currentLang==="zh-Hant"?"《"+esc(title)+"》":currentLang==="ja"?"『"+esc(title)+"』":esc(title)}</h3>
              <div class="meta">
                <span class="tag">${esc(st.label)}</span>
                ${b.status==="採購中"?`<span class="pending-note">${esc(u.pending)}</span>`:""}
              </div>
              ${b.status==="採購中"?`
                <div class="book-actions"><button class="pending" disabled>${esc(u.pending)}</button></div>
              `:`
                <div class="book-actions ${b.catalogJp?"two":""}">
                  <button class="primary"
                    data-catalog-title="${esc(b.titleZh)}"
                    data-catalog-qr="${esc(b.qrZh)}"
                    data-catalog-url="${esc(b.catalogZh)}"
                    data-catalog-edition="${esc(u.catalogZh).replace(" ", "<br>")}">${esc(u.catalogZh).replace(" ", "<br>")}</button>
                  ${b.catalogJp?`
                  <button class="jp"
                    data-catalog-title="${esc(b.titleJa||b.labelJp||b.titleZh)}"
                    data-catalog-qr="${esc(b.qrJp)}"
                    data-catalog-url="${esc(b.catalogJp)}"
                    data-catalog-edition="${esc(u.catalogJp).replace(" ", "<br>")}">${esc(u.catalogJp).replace(" ", "<br>")}</button>`:""}
                </div>
              `}
            </article>`;
          }).join("")}
        </div>
      </section>`;
  });

  content.innerHTML=out;
  document.getElementById("countWrap").textContent=fmt(u.count,{n:visible});
  empty.classList.toggle("show",visible===0);
}

document.getElementById("search").addEventListener("input",e=>{
  query=e.target.value;
  render();
});

const catalogModal=initCatalogModal({
  modalId:"modal",titleId:"modalTitle",editionId:"modalEdition",
  qrImgId:"qrImage",urlId:"catalogUrl",closeId:"modalCloseBtn"
});

content.addEventListener("click",e=>{
  const btn=e.target.closest("[data-catalog-title]");
  if(!btn||!catalogModal)return;
  catalogModal.show({
    title:btn.dataset.catalogTitle,
    qr:btn.dataset.catalogQr,
    url:btn.dataset.catalogUrl,
    edition:btn.dataset.catalogEdition
  });
});

document.querySelectorAll(".lang-btn").forEach(btn=>btn.addEventListener("click",()=>setLanguage(btn.dataset.lang)));

document.getElementById("backBtn").addEventListener("click",()=>{
  window.location.href=withCurrentLang("./index.html");
});

applyStatic();
localStorage.setItem("truthAfterLang",currentLang);
render();
if(typeof createIdleTimer==="function"){
  createIdleTimer(()=>{if(catalogModal)catalogModal.hide();});
}
</script>
