<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>真相之後｜東野圭吾的人性推理</title>
<style>
:root {
  --ink:#1f1b18;
  --muted:#665e56;
  --red:#9e2f2a;
  --paper:rgba(250,246,239,.92);
  --paper-strong:rgba(250,246,239,.97);
  --line:rgba(91,72,58,.24);
  --shadow:0 18px 50px rgba(48,36,28,.16);
  /* 六大主題色（--reason/--after/--love/--justice/--youth/--hope）
     統一定義在 css/theme.css，這裡不再重複，避免以後改色只改到一半。 */
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3eadf;color:var(--ink);font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif}
button{font:inherit;color:inherit}
.stage{
  width:100vw;height:100vh;min-height:720px;position:relative;overflow:hidden;
  /* 底圖由 css/theme.css 的 body.page-home .stage 統一管理 */
}

.red-thread{position:absolute;inset:0;pointer-events:none;opacity:.46}
.red-thread svg{width:100%;height:100%}
.app{position:relative;z-index:2;height:100%;padding:3.2vh 3.2vw 2.4vh;display:grid;grid-template-rows:auto 1fr auto;gap:2vh}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.hero{max-width:48vw}
.eyebrow{font-size:clamp(18px,1.15vw,28px);letter-spacing:.14em;color:#7a2721;font-weight:700}
.title{font-size:clamp(72px,7vw,150px);line-height:.96;margin:.1em 0 .08em;letter-spacing:.04em}
.subtitle{font-size:clamp(31px,2.65vw,56px);letter-spacing:.14em;margin-bottom:.35em}
.tagline{font-size:clamp(21px,1.35vw,31px);line-height:1.55;color:#3d3732;max-width:980px}

.top-actions{display:flex;gap:12px}
.top-btn{
  min-height:64px;padding:12px 22px;border-radius:16px;border:1px solid rgba(255,255,255,.6);
  color:#fff;background:rgba(38,31,27,.62);backdrop-filter:blur(8px);cursor:pointer;
  font-size:clamp(18px,1.1vw,26px)
}

.case-wrap{align-self:end}
.case-title{font-size:clamp(20px,1.3vw,29px);font-weight:700;margin-bottom:1vh}
.case-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5vh 1.2vw}
.case{
  position:relative;min-height:15.3vh;padding:1.8vh 1.4vw 1.7vh;border-radius:22px;border:1px solid var(--line);
  background:var(--paper);box-shadow:var(--shadow);text-align:left;cursor:pointer;transition:.16s ease;overflow:hidden
}
.case::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
.case:hover,.case:focus-visible{transform:translateY(-4px);border-color:var(--accent);outline:3px solid rgba(158,47,42,.12)}
.case small{display:block;color:var(--accent);font-size:clamp(16px,1.05vw,24px);letter-spacing:.06em;margin-bottom:.75vh}
.case strong{display:block;font-size:clamp(24px,1.85vw,40px);line-height:1.22;margin-bottom:.65vh}
.case span{display:block;color:var(--muted);font-size:clamp(15px,.95vw,22px)}

.footer{display:grid;grid-template-columns:repeat(4,1fr);gap:1vw}
.footer button{
  min-height:8vh;border-radius:18px;border:1px solid var(--line);background:var(--paper-strong);cursor:pointer;
  box-shadow:0 8px 24px rgba(31,25,20,.09);font-size:clamp(19px,1.2vw,27px);font-weight:700
}
.footer button:hover,.footer button:focus-visible{border-color:var(--red);outline:3px solid rgba(158,47,42,.12)}

.panel{
  position:absolute;z-index:10;inset:4vh 4vw;background:rgba(248,244,236,.985);border-radius:28px;border:1px solid var(--line);
  box-shadow:0 30px 90px rgba(0,0,0,.28);padding:4vh 4vw;display:none;overflow:auto
}
.panel.open{display:block}
.close{
  position:sticky;top:0;float:right;border:0;background:#2c2722;color:#fff;border-radius:14px;
  min-height:58px;padding:12px 22px;font-size:22px;cursor:pointer
}
.panel-kicker{color:var(--red);font-weight:700;letter-spacing:.08em;font-size:22px}
.panel h2{font-size:clamp(46px,4vw,84px);margin:.2em 0 .25em}
.panel p{font-size:clamp(22px,1.45vw,31px);line-height:1.75;max-width:1100px;color:#403933}
.panel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:26px}
.book{border:1px solid var(--line);border-radius:18px;background:#fff;padding:22px}
.book b{font-size:clamp(22px,1.35vw,30px)}
.book p{font-size:18px;line-height:1.55;margin-bottom:0;color:var(--muted)}

.status{position:absolute;left:50%;bottom:1.1vh;transform:translateX(-50%);z-index:3;color:#fff;font-size:clamp(15px,.9vw,20px);text-shadow:0 1px 3px rgba(0,0,0,.55)}

@media (max-width:1000px){
  .hero{max-width:60vw}
  .case-grid{grid-template-columns:repeat(2,1fr)}
  .footer{grid-template-columns:repeat(2,1fr)}
  .panel-grid{grid-template-columns:1fr}
}

/* ===== 首頁打字機開場效果 ===== */
.case-title{
  min-height:1.55em; /* 避免文字逐字出現時版面跳動 */
}

.typing-cursor{
  display:inline-block;
  margin-left:4px;
  color:var(--red, #9e2f2a);
  animation:cursorBlink .75s steps(1,end) infinite;
}

@keyframes cursorBlink{
  0%,45%{opacity:1}
  46%,100%{opacity:0}
}

/* 六大 CASE 初始隱藏，等打字完成後依序進場 */
.case-grid .case{
  opacity:0;
  transform:translateY(18px);
  pointer-events:none;
}

.case-grid .case.case-reveal{
  opacity:1;
  transform:translateY(0);
  pointer-events:auto;
  transition:
    opacity .5s ease,
    transform .55s cubic-bezier(.22,.61,.36,1),
    border-color .16s ease,
    box-shadow .16s ease;
}


/* ===== 六大 CASE｜調查模式 ===== */
.panel.case-mode{padding:3.1vh 3.2vw 3.6vh;overflow:auto}
.case-shell{max-width:1720px;margin:0 auto;padding-bottom:3vh}
.case-head{padding-right:130px}
.case-head-row{display:flex;align-items:center;justify-content:space-between;gap:22px}
.case-progress{display:flex;align-items:center;gap:12px;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--muted);font-size:16px;font-weight:700}
.progress-dots{display:flex;gap:8px}
.progress-dot{width:12px;height:12px;border-radius:999px;border:1px solid rgba(158,47,42,.38);background:rgba(158,47,42,.08)}
.progress-dot.done{background:var(--red);border-color:var(--red)}
.progress-dot.current{box-shadow:0 0 0 4px rgba(158,47,42,.12)}
.case-head h2{font-size:clamp(44px,3.8vw,76px);margin:.16em 0 .16em;line-height:1.12}
.panel .case-scene{font-size:clamp(21px,1.3vw,29px);line-height:1.65;max-width:1320px;margin:.35em 0 0}
.investigate-title{margin:24px 0 12px;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:clamp(18px,1.15vw,25px);font-weight:800;color:#3d342e}
.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.choice-btn{min-height:130px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.9);padding:20px 22px;text-align:left;cursor:pointer;box-shadow:0 10px 28px rgba(55,42,33,.08);transition:.2s ease;position:relative;overflow:hidden}
.choice-btn::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:.24s ease}
.choice-btn:hover,.choice-btn.selected{transform:translateY(-3px);border-color:rgba(158,47,42,.55);box-shadow:0 14px 34px rgba(55,42,33,.13)}
.choice-btn.selected::after{transform:scaleX(1)}
.choice-title{display:block;font-size:clamp(22px,1.35vw,30px);font-weight:800;margin-bottom:6px}
.choice-code{display:block;color:var(--red);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:12px;letter-spacing:.18em;font-weight:900;margin-bottom:6px}
.choice-hint{display:block;color:var(--muted);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.45}
.choice-feedback{display:none;margin:18px 0 6px;padding:17px 20px;border-left:4px solid var(--red);border-radius:0 16px 16px 0;background:rgba(158,47,42,.055);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:17px;line-height:1.7;color:#453a33}
.choice-feedback.show{display:block;animation:fadeInUp .35s ease both}
.clue-zone{display:none;margin-top:22px;position:relative}
.clue-zone.show{display:block}
.clue-thread{height:2px;background:linear-gradient(90deg,var(--red),rgba(158,47,42,.12));transform:scaleX(0);transform-origin:left;animation:threadDraw .85s ease forwards;margin:0 4% 16px}
@keyframes threadDraw{to{transform:scaleX(1)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.clue-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.clue-card{opacity:0;transform:translateY(18px);border:1px solid var(--line);border-radius:20px;background:#fff;padding:20px;box-shadow:0 10px 28px rgba(55,42,33,.07)}
.clue-card.reveal{animation:fadeInUp .5s ease forwards}
.clue-no{color:var(--red);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:12px;letter-spacing:.16em;font-weight:900}
.clue-card h3{font-size:clamp(22px,1.35vw,30px);margin:7px 0 14px}
.clue-label{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--muted);font-size:12px;letter-spacing:.12em;font-weight:800;margin-top:10px}
.clue-question{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.55;color:#342e2a;margin-top:4px}
.clue-real{color:#7d2b25;font-weight:700}
.clue-more{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed rgba(91,72,58,.22);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.65;color:#5a5048}
.clue-more.show{display:block}
.clue-expand{margin-top:14px;border:1px solid rgba(158,47,42,.28);background:#fff8f4;color:#7c2a25;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}
.case-closeout{display:none;margin-top:28px;padding:22px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.72)}
.case-closeout.show{display:block;animation:fadeInUp .35s ease both}
.case-closeout .closeout-kicker{color:var(--red);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:13px;letter-spacing:.16em;font-weight:900}
.case-closeout h3{font-size:clamp(24px,1.55vw,34px);margin:8px 0 14px}
.verdict-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.verdict-btn{border:1px solid var(--line);background:#fff;border-radius:16px;padding:15px 18px;text-align:left;cursor:pointer;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;font-weight:700;line-height:1.5}
.verdict-btn:hover,.verdict-btn.selected{border-color:var(--red);background:#fff5f1}
.verdict-response{display:none;margin-top:14px;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.7;color:#4b413a}
.verdict-response.show{display:block}
.case-nav{display:none;margin-top:18px;grid-template-columns:1fr 1fr;gap:12px}
.case-nav.show{display:grid}
.case-nav button{min-height:56px;border-radius:15px;border:1px solid var(--line);background:#fff;font-weight:800;cursor:pointer;font-size:16px}
.case-nav .next{background:#2d2925;color:#fff;border-color:#2d2925}
.report-card{margin-top:22px;padding:24px;border-radius:22px;background:linear-gradient(135deg,#2d2824,#4a3f37);color:#fff;box-shadow:0 16px 40px rgba(32,25,20,.18)}
.report-card .report-kicker{color:#e8b6ab;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:13px;letter-spacing:.18em;font-weight:900}
.report-card h3{margin:8px 0 10px;font-size:clamp(28px,2vw,42px)}
.panel .report-card p{color:rgba(255,255,255,.84);font-size:17px;line-height:1.7;margin:0;max-width:1000px}

@media(max-width:1050px){.choice-grid,.clue-grid{grid-template-columns:1fr}.verdict-grid{grid-template-columns:1fr}.case-head{padding-right:90px}}

/* ===== 最終調查報告 v3：三軸人格 + 三面向結案判斷 ===== */
.report-summary{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(340px,.95fr);gap:24px;align-items:start;margin-top:18px}
.report-profile-copy{font-size:17px;line-height:1.8;color:rgba(255,255,255,.88)}
.report-axis-box,.report-judgement{
  border:1px solid rgba(255,255,255,.14);
  border-radius:18px;
  background:rgba(255,255,255,.07);
  padding:18px 20px
}
.report-axis-title,.report-judgement-title{
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:13px;font-weight:900;letter-spacing:.14em;color:#f1c8be;margin-bottom:12px
}
.report-axis-row{
  display:grid;grid-template-columns:92px 1fr 28px;gap:10px;align-items:center;
  margin:11px 0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif
}
.report-axis-label{font-size:14px;color:rgba(255,255,255,.84)}
.report-axis-track{height:9px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
.report-axis-fill{height:100%;border-radius:999px;background:#e8b6ab}
.report-axis-score{text-align:right;font-weight:900;font-size:14px;color:#fff}
.report-judgement{margin-top:18px}
.judgement-grid{display:grid;gap:12px;margin-top:10px}
.judgement-item{
  border:1px solid rgba(255,255,255,.12);
  border-radius:15px;
  background:rgba(0,0,0,.08);
  padding:14px 16px
}
.judgement-item-head{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  margin-bottom:7px
}
.judgement-dimension{
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:13px;font-weight:900;letter-spacing:.08em;color:#f1c8be
}
.judgement-result{
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:15px;font-weight:900;color:#fff
}
.panel .judgement-item p{margin:0;color:rgba(255,255,255,.82);font-size:15px;line-height:1.7}
.report-closing{
  margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.14);
  color:rgba(255,255,255,.72);font-size:15px;line-height:1.7
}
@media(max-width:900px){
  .report-summary{grid-template-columns:1fr}
  .report-axis-row{grid-template-columns:88px 1fr 24px}
  .judgement-item-head{align-items:flex-start;flex-direction:column;gap:4px}
}

/* ===== 非線性調查流程：首頁完成狀態 ===== */
.home-progress{
  margin:-.2vh 0 1.1vh;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:clamp(15px,.95vw,20px);
  font-weight:800;
  color:var(--muted);
}
.case.completed{
  border-color:rgba(158,47,42,.42);
  box-shadow:0 12px 30px rgba(72,52,38,.12), inset 0 0 0 2px rgba(158,47,42,.05);
}
.case-complete-badge{
  position:absolute;
  right:14px;
  top:12px;
  z-index:2;
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:6px 10px;
  border-radius:999px;
  background:rgba(158,47,42,.10);
  color:var(--red);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:12px;
  line-height:1;
  font-weight:900;
  letter-spacing:.04em;
}



/* ===== 重新展開調查：確認彈窗 + 提示訊息 ===== */
.confirm-modal{
  position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;
  padding:28px;background:rgba(31,23,18,.55);backdrop-filter:blur(3px);
}
.confirm-modal.show{display:flex}
.confirm-card{
  width:min(560px,90vw);background:#fffaf3;border:1px solid rgba(92,73,59,.18);border-radius:24px;
  padding:30px 32px;box-shadow:0 28px 80px rgba(0,0,0,.28);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
.confirm-kicker{color:var(--red);font-weight:800;letter-spacing:.1em;font-size:14px;margin-bottom:10px}
.confirm-card h3{
  margin:0 0 10px;font-size:clamp(24px,2vw,32px);
  font-family:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",serif;
}
.confirm-card p{margin:0 0 22px;color:var(--muted);font-size:17px;line-height:1.7}
.confirm-actions{display:flex;gap:12px;justify-content:flex-end}
.confirm-actions button{
  border-radius:14px;padding:13px 22px;font-weight:800;cursor:pointer;font-size:16px;
  border:1px solid var(--line);min-height:52px;
}
.confirm-actions .secondary{background:#fff}
.confirm-actions .primary{background:var(--red);color:#fff;border-color:var(--red)}

.toast{
  position:fixed;left:50%;bottom:6vh;transform:translate(-50%,20px);z-index:10000;
  background:#2c2722;color:#fff;padding:16px 26px;border-radius:999px;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:clamp(16px,1vw,20px);font-weight:700;
  opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s ease;
  box-shadow:0 14px 40px rgba(0,0,0,.28);max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}


/* ============================================================
   手機版 RWD｜第一階段
   ============================================================ */
@media (max-width:768px){
  html,body{
    width:100%;
    height:auto;
    min-height:100%;
    overflow-x:hidden;
    overflow-y:auto;
  }

  .stage{
    width:100%;
    height:auto;
    min-height:100dvh;
    overflow:visible;
  }

  .app{
    height:auto;
    min-height:100dvh;
    display:block;
    padding:22px 16px 28px;
  }

  .top{display:block}
  .hero{max-width:none;width:100%}
  .eyebrow{font-size:14px;letter-spacing:.11em;line-height:1.45}
  .title{font-size:clamp(52px,16vw,78px);line-height:1.02;margin:.12em 0 .1em}
  .subtitle{font-size:clamp(24px,7vw,34px);line-height:1.22;letter-spacing:.07em;margin-bottom:.55em}
  .tagline{max-width:none;font-size:17px;line-height:1.7}

  .top-actions{margin-top:18px;justify-content:flex-start}
  .top-btn{min-height:50px;padding:10px 16px;border-radius:13px;font-size:15px}

  .case-wrap{margin-top:30px}
  .case-title{font-size:20px;line-height:1.5;margin-bottom:6px}
  .home-progress{margin:0 0 14px;font-size:14px}

  .case-grid{grid-template-columns:1fr;gap:12px}
  .case{min-height:0;padding:18px 18px 17px 20px;border-radius:18px}
  .case small{font-size:14px;margin-bottom:7px}
  .case span{font-size:14px;line-height:1.45}

  .footer{margin-top:18px;grid-template-columns:repeat(2,1fr);gap:10px}
  .footer button{min-height:58px;border-radius:15px;font-size:16px;line-height:1.35;padding:10px 8px}

  .status{display:none}

  .panel{
    position:fixed;
    inset:0;
    width:100%;
    height:100dvh;
    border:0;
    border-radius:0;
    padding:18px 15px 34px;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    background:rgba(248,244,236,.995);
  }

  .panel.case-mode{padding:18px 15px 36px}
  .close{
    position:sticky;
    top:0;
    z-index:20;
    min-height:48px;
    padding:9px 14px;
    border-radius:12px;
    font-size:15px;
    margin-bottom:8px;
  }

  .case-shell{max-width:none;padding-bottom:10px}
  .case-head{padding-right:0}
  .case-head-row{align-items:flex-start;flex-direction:column;gap:8px}
  .panel-kicker{font-size:15px}
  .case-progress{width:100%;justify-content:space-between;gap:8px;font-size:13px;flex-wrap:wrap}
  .progress-dots{gap:6px}
  .progress-dot{width:10px;height:10px}

  .case-head h2{font-size:clamp(34px,10vw,48px);line-height:1.17;margin:.25em 0 .22em}
  .panel .case-scene{font-size:17px;line-height:1.75;margin-top:0}
  .investigate-title{margin:24px 0 11px;font-size:17px;line-height:1.5}

  .choice-grid,.clue-grid,.verdict-grid{grid-template-columns:1fr;gap:11px}

}

function t(path,lang=currentLang){
  return getNested(i18n[lang],path) ?? getNested(i18n["zh-Hant"],path) ?? path;
}

function formatText(template,values={}){
  return String(template).replace(/\{(\w+)\}/g,(m,key)=>values[key] ?? m);
}

function resolveInitialLanguage(){
  const params=new URLSearchParams(window.location.search);
  return normalizeLang(params.get("lang"))
    || normalizeLang(localStorage.getItem("truthAfterLang"))
    || "zh-Hant";
}

let currentLang=resolveInitialLanguage();

function updateLanguageButtons(){
  document.querySelectorAll("[data-lang]").forEach(btn=>{
    btn.setAttribute("aria-pressed",String(btn.dataset.lang===currentLang));
  });
}

function applyStaticTranslations(){
  document.documentElement.lang=currentLang;

  document.querySelectorAll("[data-i18n]").forEach(el=>{
    el.textContent=t(el.dataset.i18n);
  });

  updateLanguageButtons();
  updateHomeProgress();
}

function setLanguage(lang,{updateUrl=true}={}){
  const normalized=normalizeLang(lang);
  if(!normalized) return;

  currentLang=normalized;
  localStorage.setItem("truthAfterLang",currentLang);

  if(updateUrl){
    const url=new URL(window.location.href);
    url.searchParams.set("lang",LANGUAGE_CONFIG[currentLang].query);
    history.replaceState(null,"",url);
  }

  applyStaticTranslations();
  if(currentCaseKey && panel.classList.contains("open")){
    openCaseByKey(currentCaseKey);
  }else{
    resetTypewriterForLanguage();
  }
}

document.querySelectorAll("[data-lang]").forEach(btn=>{
  btn.addEventListener("click",()=>setLanguage(btn.dataset.lang));
});

const panel=document.getElementById("panel");
const content=document.getElementById("panelContent");
let currentCaseKey=null;
const progress=JSON.parse(localStorage.getItem("truthAfterProgress")||"{}");

function saveProgress(){localStorage.setItem("truthAfterProgress",JSON.stringify(progress));}
function resetProgress(){Object.keys(progress).forEach(k=>delete progress[k]);localStorage.removeItem("truthAfterProgress");}
function openPanel(html){content.innerHTML=html;panel.classList.add("open","case-mode");document.body.classList.add("panel-open");panel.scrollTop=0;}
function closePanel(){panel.classList.remove("open","case-mode");document.body.classList.remove("panel-open");currentCaseKey=null;updateHomeProgress();}
function updateHomeProgress(){
  const doneCount=caseOrder.filter(k=>progress[k]?.done).length;
  const progressEl=document.getElementById("homeProgress");
  if(progressEl){
    if(currentLang==="en"){
      progressEl.textContent=`${t("common.progressPrefix")} ${doneCount} ${t("common.progressSuffix")}`;
    }else{
      progressEl.textContent=`${t("common.progressPrefix")} ${doneCount} ${t("common.progressSuffix")}`;
    }
  }

  document.querySelectorAll("[data-case]").forEach(btn=>{
    const key=btn.dataset.case;
    const isDone=!!progress[key]?.done;
    btn.classList.toggle("completed",isDone);

    let badge=btn.querySelector(".case-complete-badge");
    if(isDone){
      if(!badge){
        badge=document.createElement("span");
        badge.className="case-complete-badge";
        btn.appendChild(badge);
      }
      badge.textContent="✓ 已完成";
    }else if(badge){
      badge.remove();
    }
  });

  const restartBtn=document.getElementById("restartInvestigationBtn");
  if(restartBtn){
    const introFinished=document.body.classList.contains("home-intro-finished");
    restartBtn.classList.toggle("restart-visible",doneCount>0 && introFinished);
  }
}

function getNextUnfinishedCase(fromKey){
  const start=caseOrder.indexOf(fromKey);
  for(let offset=1; offset<=caseOrder.length; offset++){
    const idx=(start+offset)%caseOrder.length;
    const key=caseOrder[idx];
    if(!progress[key]?.done) return key;
  }
  return null;
}

function dotsFor(key){
  const idx=caseOrder.indexOf(key);
  const doneCount=caseOrder.filter(k=>progress[k]?.done).length;
  return `<div class="case-progress">
    <span>${t("common.investigationProgress")}</span>
    <div class="progress-dots">
      ${caseOrder.map((k,i)=>`<i class="progress-dot ${progress[k]?.done?'done':''} ${i===idx?'current':''}"></i>`).join("")}
    </div>
    <span>已完成 ${doneCount} / 6</span>
  </div>`;
}
function openCaseByKey(key){
  const c=getCaseData(key); if(!c) return; currentCaseKey=key;
  openPanel(`
    <div class="case-shell">
      <div class="case-head">
        <div class="case-head-row"><div class="panel-kicker">${c.case}</div>${dotsFor(key)}</div>
        <h2>${c.title}</h2>
        <p class="case-scene">${c.scene}</p>
      </div>
      <div class="investigate-title">${c.prompt}</div>
      <div class="choice-grid">
        ${c.choices.map(ch=>`<button class="choice-btn" data-choice="${ch.id}"><span class="choice-title">${ch.title}</span><span class="choice-code">${ch.code}</span><span class="choice-hint">${ch.hint}</span></button>`).join("")}
      </div>
      <div class="choice-feedback" id="choiceFeedback"></div>
      <div class="clue-zone" id="clueZone">
        <div class="clue-thread"></div>
        <div class="clue-grid">
          ${c.books.map((b,i)=>`<article class="clue-card" data-clue="${i}"><div class="clue-no">LINE 0${i+1}｜${t("common.evidence")}</div><h3>《${b.title}》</h3><div class="clue-label">${t("common.surfaceQuestion")}</div><div class="clue-question">${b.surface}</div><div class="clue-label">${t("common.realQuestion")}</div><div class="clue-question clue-real">${b.real}</div><button class="clue-expand" data-expand="${i}">${t("common.expandClue")}</button><div class="clue-more" id="clueMore${i}">${b.more}</div></article>`).join("")}
        </div>
      </div>
      <section class="case-closeout" id="caseCloseout">
        <div class="closeout-kicker">${t("common.caseReview")}</div><h3>${c.closeQ}</h3>
        <div class="verdict-grid">${c.verdicts.map((v,i)=>`<button class="verdict-btn" data-verdict="${i}">${v}</button>`).join("")}</div>
        <div class="verdict-response" id="verdictResponse"></div>
        <div class="case-nav" id="caseNav"><button data-return-cases>${t("common.returnCases")}</button><button class="next" data-next-case></button></div>
        <div id="finalReport"></div>
      </section>
    </div>`);

  document.querySelectorAll(".choice-btn").forEach(btn=>btn.addEventListener("click",()=>choosePerspective(btn.dataset.choice)));
  document.querySelectorAll(".clue-expand").forEach(btn=>btn.addEventListener("click",()=>toggleClue(+btn.dataset.expand,btn)));
  document.querySelectorAll(".verdict-btn").forEach(btn=>btn.addEventListener("click",()=>chooseVerdict(+btn.dataset.verdict,btn)));
  const returnBtn=document.querySelector("[data-return-cases]"); if(returnBtn) returnBtn.addEventListener("click",closePanel);
  const nextBtn=document.querySelector("[data-next-case]"); if(nextBtn) nextBtn.addEventListener("click",goNextCase);

  restoreCaseState(key);
}

function restoreCaseState(key){
  const saved=progress[key];
  if(!saved) return;

  if(saved.choice){
    const c=getCaseData(key);
    const ch=c.choices.find(x=>x.id===saved.choice);
    document.querySelectorAll(".choice-btn").forEach(b=>
      b.classList.toggle("selected",b.dataset.choice===saved.choice)
    );

    const feedback=document.getElementById("choiceFeedback");
    if(ch && feedback){
      feedback.innerHTML=`<strong>${formatText(t("common.originalChoice"),{choice:ch.title})}</strong><br>${ch.reply}`;
      feedback.classList.add("show");
    }

    const zone=document.getElementById("clueZone");
    if(zone) zone.classList.add("show");
    document.querySelectorAll(".clue-card").forEach(card=>card.classList.add("reveal"));

    const closeout=document.getElementById("caseCloseout");
    if(closeout) closeout.classList.add("show");
  }

  if(saved.verdict===0 || saved.verdict===1){
    const c=getCaseData(key);
    document.querySelectorAll(".verdict-btn").forEach((b,i)=>
      b.classList.toggle("selected",i===saved.verdict)
    );

    const res=document.getElementById("verdictResponse");
    if(res){
      res.innerHTML=`<strong>${t("common.judgementRecorded")}</strong><br>${c.closeText}`;
      res.classList.add("show");
    }

    const nav=document.getElementById("caseNav");
    if(nav) nav.classList.add("show");
    updateNextButton();
  }

  if(caseOrder.every(k=>progress[k]?.done)){
    renderReport();
  }
}

function updateNextButton(){
  const next=document.querySelector("[data-next-case]");
  if(!next || !currentCaseKey) return;

  const unfinished=getNextUnfinishedCase(currentCaseKey);
  if(unfinished){
    next.textContent=formatText(t("common.continueCase"),{case:getCaseData(unfinished).case});
  }else{
    next.textContent=t("common.viewReport");
  }
}

function choosePerspective(choiceId){
  const c=getCaseData(currentCaseKey), ch=c.choices.find(x=>x.id===choiceId); if(!ch) return;
  progress[currentCaseKey]=progress[currentCaseKey]||{}; progress[currentCaseKey].choice=choiceId; saveProgress();
  document.querySelectorAll(".choice-btn").forEach(b=>b.classList.toggle("selected",b.dataset.choice===choiceId));
  const feedback=document.getElementById("choiceFeedback"); feedback.innerHTML=`<strong>${formatText(t("common.currentChoice"),{choice:ch.title})}</strong><br>${ch.reply}`; feedback.classList.add("show");
  const zone=document.getElementById("clueZone"); zone.classList.add("show");
  document.querySelectorAll(".clue-card").forEach((card,i)=>setTimeout(()=>card.classList.add("reveal"),260+i*260));
  setTimeout(()=>document.getElementById("caseCloseout").classList.add("show"),1150);
  if(caseOrder.every(k=>progress[k]?.done)) setTimeout(renderReport,80);
}
function toggleClue(i,btn){const el=document.getElementById(`clueMore${i}`); const open=el.classList.toggle("show"); btn.textContent=open?t("common.collapseClue"):t("common.expandClue");}
function chooseVerdict(i,btn){
  const c=getCaseData(currentCaseKey);
  progress[currentCaseKey]=progress[currentCaseKey]||{};
  progress[currentCaseKey].verdict=i;
  progress[currentCaseKey].done=true;
  saveProgress();

  document.querySelectorAll(".verdict-btn").forEach(b=>b.classList.toggle("selected",b===btn));

  const res=document.getElementById("verdictResponse");
  res.innerHTML=`<strong>${t("common.judgementRecorded")}</strong><br>${c.closeText}`;
  res.classList.add("show");

  const nav=document.getElementById("caseNav");
  nav.classList.add("show");

  updateHomeProgress();
  updateNextButton();

  if(caseOrder.every(k=>progress[k]?.done)) renderReport();
}
function goNextCase(){
  const unfinished=getNextUnfinishedCase(currentCaseKey);
  if(unfinished){
    openCaseByKey(unfinished);
  }else{
    renderReport();
  }
}


function renderReport(){
  const el=document.getElementById("finalReport");
  if(!el) return;
  const rt=reportTranslations[currentLang] || reportTranslations["zh-Hant"];

  // 第一層：六個 CASE 的「調查視角」映射到三個調查軸
  // A = 線索／事實、B = 人物／動機、C = 餘波／價值
  const axisMap={
    reason:{how:"A",why:"B",after:"C"},
    after:{trace:"A",secret:"B",remain:"C"},
    love:{act:"A",why:"B",boundary:"C"},
    justice:{law:"A",hurt:"B",system:"C"},
    youth:{event:"A",pressure:"B",after:"C"},
    hope:{mystery:"A",wish:"B",hope:"C"}
  };

  const scores={A:0,B:0,C:0};
  caseOrder.forEach(key=>{
    const choice=progress[key]?.choice;
    const axis=axisMap[key]?.[choice];
    if(axis) scores[axis]++;
  });

  const maxScore=Math.max(scores.A,scores.B,scores.C);
  const leaders=Object.keys(scores).filter(k=>scores[k]===maxScore);

  let profile,desc;
  if(leaders.length!==1){
    profile=rt.profiles.mixed.name;
    desc=rt.profiles.mixed.desc;
  }else{
    const p=rt.profiles[leaders[0]];
    profile=p.name;
    desc=p.desc;
  }

  // 第二層：六個 CASE 的結案判斷分成三組，每組固定兩題
  const v={
    reason:progress.reason?.verdict,
    after:progress.after?.verdict,
    love:progress.love?.verdict,
    justice:progress.justice?.verdict,
    youth:progress.youth?.verdict,
    hope:progress.hope?.verdict
  };

  function pairResult(a,b,leftName,midName,rightName,leftDesc,midDesc,rightDesc){
    const vals=[a,b].filter(x=>x===0 || x===1);
    const left=vals.filter(x=>x===0).length;
    const right=vals.filter(x=>x===1).length;

    if(left>right) return {name:leftName,desc:leftDesc};
    if(right>left) return {name:rightName,desc:rightDesc};
    return {name:midName,desc:midDesc};
  }

  const truthView=pairResult(
    v.reason,v.hope,
    rt.truth.left.name,rt.truth.mid.name,rt.truth.right.name,
    rt.truth.left.desc,rt.truth.mid.desc,rt.truth.right.desc
  );

  const aftermathView=pairResult(
    v.after,v.youth,
    rt.aftermath.left.name,rt.aftermath.mid.name,rt.aftermath.right.name,
    rt.aftermath.left.desc,rt.aftermath.mid.desc,rt.aftermath.right.desc
  );

  const justiceView=pairResult(
    v.love,v.justice,
    rt.justice.left.name,rt.justice.mid.name,rt.justice.right.name,
    rt.justice.left.desc,rt.justice.mid.desc,rt.justice.right.desc
  );

  const pct=n=>Math.round((n/6)*100);

  el.innerHTML=`
    <div class="report-card">
      <div class="report-kicker">INVESTIGATION REPORT｜最終調查報告</div>
      <h3>${profile}</h3>

      <div class="report-summary">
        <div class="report-profile-copy">${desc}</div>

        <div class="report-axis-box">
          <div class="report-axis-title">你的調查傾向</div>

          <div class="report-axis-row">
            <div class="report-axis-label">線索與事實</div>
            <div class="report-axis-track"><div class="report-axis-fill" style="width:${pct(scores.A)}%"></div></div>
            <div class="report-axis-score">${scores.A}</div>
          </div>

          <div class="report-axis-row">
            <div class="report-axis-label">人物與動機</div>
            <div class="report-axis-track"><div class="report-axis-fill" style="width:${pct(scores.B)}%"></div></div>
            <div class="report-axis-score">${scores.B}</div>
          </div>

          <div class="report-axis-row">
            <div class="report-axis-label">餘波與價值</div>
            <div class="report-axis-track"><div class="report-axis-fill" style="width:${pct(scores.C)}%"></div></div>
            <div class="report-axis-score">${scores.C}</div>
          </div>
        </div>

        <div class="report-judgement">
          <div class="report-judgement-title">你的結案判斷</div>

          <div class="judgement-grid">
            <div class="judgement-item">
              <div class="judgement-item-head">
                <div class="judgement-dimension">真相觀｜答案 ↔ 理解</div>
                <div class="judgement-result">${truthView.name}</div>
              </div>
              <p>${truthView.desc}</p>
            </div>

            <div class="judgement-item">
              <div class="judgement-item-head">
                <div class="judgement-dimension">餘波觀｜重新開始 ↔ 承認傷痕</div>
                <div class="judgement-result">${aftermathView.name}</div>
              </div>
              <p>${aftermathView.desc}</p>
            </div>

            <div class="judgement-item">
              <div class="judgement-item-head">
                <div class="judgement-dimension">正義觀｜情境判斷 ↔ 原則界線</div>
                <div class="judgement-result">${justiceView.name}</div>
              </div>
              <p>${justiceView.desc}</p>
            </div>
          </div>
        </div>

        <div class="report-closing">
          你的六件案件已完成。真相沒有消失，只是你開始看見，答案之外還有人。
        </div>
      </div>
    </div>`;

  el.scrollIntoView({behavior:"smooth",block:"nearest"});
}

/* ===== 重新展開調查：讀者可主動清空進度，探索不同的可能 ===== */
const toastEl=document.getElementById("toast");
function showToast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer=setTimeout(()=>toastEl.classList.remove("show"),2400);
}

const restartConfirm=document.getElementById("restartConfirm");
function openRestartConfirm(){restartConfirm.classList.add("show");restartConfirm.setAttribute("aria-hidden","false");}
function closeRestartConfirm(){restartConfirm.classList.remove("show");restartConfirm.setAttribute("aria-hidden","true");}

function restartInvestigation(){
  if(Object.keys(progress).length===0){
    showToast(t("common.freshToast"));
    return;
  }
  openRestartConfirm();
}

document.getElementById("restartInvestigationBtn").addEventListener("click",restartInvestigation);
document.getElementById("restartCancelBtn").addEventListener("click",closeRestartConfirm);
document.getElementById("restartConfirmBtn").addEventListener("click",()=>{
  resetProgress();
  closePanel();
  updateHomeProgress();
  closeRestartConfirm();
  showToast(t("common.restartedToast"));
});
restartConfirm.addEventListener("click",e=>{if(e.target===restartConfirm) closeRestartConfirm();});



function withCurrentLang(path){
  const url=new URL(path,window.location.href);
  url.searchParams.set("lang",LANGUAGE_CONFIG[currentLang].query);
  return `${url.pathname.split("/").pop()}${url.search}`;
}

document.querySelectorAll("[data-case]").forEach(btn=>btn.addEventListener("click",()=>openCaseByKey(btn.dataset.case)));
document.querySelectorAll("[data-action]").forEach(btn=>btn.addEventListener("click",()=>{const action=btn.dataset.action;if(action==="books"){window.location.href=withCurrentLang("book-list.html");return;}if(action==="film"){openPanel(`<h2>${t("nav.film")}</h2><p>${t("common.filmPlaceholder")}</p>`);}}));
document.getElementById("universeBtn").addEventListener("click",()=>window.location.href=withCurrentLang("works-universe.html"));
document.getElementById("quizBtn").addEventListener("click",()=>window.location.href=withCurrentLang("reader-quiz.html"));
document.getElementById("closeBtn").addEventListener("click",closePanel);

const params=new URLSearchParams(window.location.search); const requestedCase=params.get("case"); if(requestedCase)setTimeout(()=>openCaseByKey(requestedCase),120);
// 展場 kiosk 才啟用閒置重置；手機是個人裝置，保留 localStorage 進度，不自動打斷閱讀。
const isMobileDevice=window.matchMedia("(max-width:768px)").matches;

if(!isMobileDevice){
  createIdleTimer(()=>closePanel());
  // Tier 2：完全沒有任何操作達 3 分鐘，才視為訪客已離開，
  // 清空調查進度，讓下一位展場訪客從頭開始。
  createIdleTimer(()=>{resetProgress();updateHomeProgress();},180000);
}


// ===== 首頁打字機 + CASE 依序淡入 =====
let typewriterText = t("hero.prompt");
const typewriterTarget = document.getElementById("typewriter-title");
const typingCursor = document.querySelector(".typing-cursor");
const caseCards = [...document.querySelectorAll(".case-grid .case")];

let typewriterIndex = 0;

function revealCaseCards(){
  const progressEl=document.getElementById("homeProgress");

  // 先顯示調查進度，再讓六張 CASE 依序進場
  if(progressEl){
    progressEl.classList.add("progress-reveal");
  }

  document.body.classList.add("home-intro-finished");
  updateHomeProgress();

  caseCards.forEach((card, i)=>{
    setTimeout(()=>{
      card.classList.add("case-reveal");
    }, 180 + i * 120);
  });
}


function resetTypewriterForLanguage(){
  typewriterText=t("hero.prompt");
  typewriterIndex=0;

  if(typewriterTarget){
    typewriterTarget.textContent="";
  }

  if(typingCursor){
    typingCursor.style.animation="cursorBlink .75s steps(1,end) infinite";
    typingCursor.style.opacity="1";
    typingCursor.style.transition="";
  }

  document.body.classList.remove("home-intro-finished");

  const progressEl=document.getElementById("homeProgress");
  if(progressEl) progressEl.classList.remove("progress-reveal");

  caseCards.forEach(card=>card.classList.remove("case-reveal"));

  setTimeout(typeWriter,180);
}

function typeWriter(){
  if(!typewriterTarget) return;

  if(typewriterIndex < typewriterText.length){
    typewriterTarget.textContent += typewriterText.charAt(typewriterIndex);
    typewriterIndex++;
    setTimeout(typeWriter, 130);
  }else{
    // 文字打完後先停一下，再讓六張 CASE 依序出現
    setTimeout(revealCaseCards, 250);

    // 游標再閃一下後消失
    setTimeout(()=>{
      if(typingCursor){
        typingCursor.style.animation = "none";
        typingCursor.style.opacity = "0";
        typingCursor.style.transition = "opacity .35s ease";
      }
    }, 1400);
  }
}

// 頁面開啟後稍微停頓再開始打字
window.addEventListener("DOMContentLoaded", ()=>{
  applyStaticTranslations();
  typewriterText=t("hero.prompt");
  setTimeout(typeWriter,650);
});

</script>
